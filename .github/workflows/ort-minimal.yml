name: ort-minimal

# 产出 sherpa 可直接消费的最小算子 ORT wasm 静态库（zip: include/ + lib/lib*.a）
# 版本对齐 csukuangfj 预编译库（v1.28.2），供 site.yml 的 c2 变体构建使用
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 允许提交 zip 后自动触发 site.yml 完成 c2 认证

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout onnxruntime v1.28.2 (shallow + submodules)
        run: |
          git clone --depth 1 --branch v1.28.2 --recurse-submodules --shallow-submodules --jobs 4 \
            https://github.com/microsoft/onnxruntime ort

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: 'emsdk-cache'

      - name: Build ORT wasm (simd, no contrib/ml ops)
        run: |
          set -o pipefail
          cd ort
          pip install -q -r requirements.txt
          mkdir -p build/Linux/Release/testdata
          echo ok > build/Linux/Release/testdata/dummy.txt   # file_packager 拒空 preload
          set +e
          ./build.sh --build_wasm --enable_wasm_simd --parallel 4 \
            --disable_ml_ops --disable_contrib_ops \
            --skip_tests --config Release > /tmp/ort-build.log 2>&1
          RC=$?
          set -e
          echo "=== build exit=$RC; errors from full log: ==="
          grep -nE "FAILED|error:|fatal" /tmp/ort-build.log | head -40
          echo "=== log tail: ==="
          tail -20 /tmp/ort-build.log
          # 救援路径：失败若发生在测试目标（provider_test 资源打包），90 档 .a 已产完（历轮实证）
          # 只要静态库齐全就继续打包，链接对错交给 site.yml 的 c2 终审判定
          NLIB=$(find build -name '*.a' | wc -l)
          echo "static libs present: $NLIB"
          if [ $RC -ne 0 ] && [ "$NLIB" -lt 80 ]; then
            echo "build failed EARLY (libs incomplete) - aborting"; exit $RC
          fi
          [ $RC -ne 0 ] && echo "build failed LATE - salvaging complete lib set"

      - name: Package sherpa-consumable zip
        run: |
          mkdir -p pkg/include pkg/lib wasm/third_party
          # 扁平化公共头文件（对齐 csukuangfj 预编译包布局：sherpa 直接 include "onnxruntime_cxx_api.h"）
          cp ort/include/onnxruntime/core/session/*.h pkg/include/
          find ort/include -name 'onnxruntime_lite_custom_op.h' -o -name 'experimental_onnxruntime*.h' -o -name 'onnxruntime_ep_*.h' | xargs -r -I{} cp {} pkg/include/
          ls pkg/include/ | head -20
          # 合并全部静态库为单档（对齐 csukuangfj 单 libonnxruntime.a，规避链接顺序问题）
          # 每档独立解包 + 成员名加归档前缀，防同名 .o 静默覆盖
          # 注意：必须收全 closure（onnx/protobuf/abseil 等），只收 libonnxruntime* 会缺 onnx::OpSchema 等符号
          mkdir -p /tmp/objs
          n=0
          echo "=== static lib inventory ==="
          find "$GITHUB_WORKSPACE/ort/build" -name '*.a' | sort | tee /tmp/lib-inventory.txt | wc -l
          for a in $(find "$GITHUB_WORKSPACE/ort/build" -name '*.a' | sort); do
            d="/tmp/m$(basename $a .a)"; mkdir -p "$d"; (cd "$d" && emar x "$a" 2>/dev/null || ar x "$a")
            for o in "$d"/*.o; do
              [ -e "$o" ] || continue
              cp "$o" "/tmp/objs/$(basename $a .a)__$(basename "$o")"
              n=$((n+1))
            done
          done
          echo "merged object files: $n"
          ls /tmp/objs | head -5
          # shim: 本最小构建的 env.cc.o 不含 defaulted ctor（库内无调用点时 LTO 不发射；
          # sherpa 链接期引用 onnxruntime::Env::Env() 官方库有、我们没有）。
          # 空体 {} 与 = default 语义等价：env_time_ 的 NSDMI 在两种形式下都会执行
          printf '#include "core/platform/env.h"\nnamespace onnxruntime { Env::Env() {} }\n' > /tmp/env_shim.cc
          emcc -c /tmp/env_shim.cc -I"$GITHUB_WORKSPACE/ort/include/onnxruntime" -I"$GITHUB_WORKSPACE/ort/onnxruntime" -flto -o /tmp/objs/libshim__env_ctor.o
          # 诊断：确认 ctor 进入合并档符号表
          "$EMSDK/upstream/bin/llvm-nm" /tmp/objs/libshim__env_ctor.o | grep Env || true
          (cd /tmp/objs && emar rc "$GITHUB_WORKSPACE/pkg/lib/libonnxruntime.a" *.o && emranlib "$GITHUB_WORKSPACE/pkg/lib/libonnxruntime.a" && echo "members: $(emar t "$GITHUB_WORKSPACE/pkg/lib/libonnxruntime.a" | wc -l)")
          ls -la "$GITHUB_WORKSPACE/pkg/lib/"
          cd $GITHUB_WORKSPACE/pkg && rm -f ../wasm/third_party/onnxruntime-wasm-static_lib-simd-1.28.2.zip && zip -qr ../wasm/third_party/onnxruntime-wasm-static_lib-simd-1.28.2.zip .
          cd $GITHUB_WORKSPACE && sha256sum wasm/third_party/onnxruntime-wasm-static_lib-simd-1.28.2.zip | tee wasm/third_party.sha256
          ls -la wasm/third_party/

      - name: Commit artifact
        run: |
          git config user.name "bench-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wasm/third_party/
          git diff --cached --quiet && echo "no changes" || (git commit -m "build: ort wasm minimal-op static lib (no contrib/ml ops) ${GITHUB_SHA::7}" && git pull --rebase -X ours && git push)

      - name: Trigger site bench (c2 certification)
        if: ${{ success() }}
        run: gh workflow run site.yml
        env:
          GH_TOKEN: ${{ github.token }}
