name: wasm-baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/wasm-baseline.yml', 'wasm/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout sherpa-onnx (pinned)
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: v1.12.7
          path: sherpa-onnx

      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: 'emsdk-cache'

      - name: Prepare model assets (zipformer-14m zh)
        shell: bash
        run: |
          cd sherpa-onnx/wasm/asr/assets
          curl -sSL -o m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2
          tar xf m.tar.bz2
          D=sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23
          mv $D/encoder-epoch-99-avg-1.int8.onnx encoder.onnx
          mv $D/decoder-epoch-99-avg-1.int8.onnx decoder.onnx
          mv $D/joiner-epoch-99-avg-1.int8.onnx joiner.onnx
          mv $D/tokens.txt ./
          rm -rf $D m.tar.bz2
          ls -lh

      - name: Build sherpa-onnx wasm (single-thread SIMD, official script)
        shell: bash
        run: |
          cd sherpa-onnx
          ./build-wasm-simd-asr.sh

      - name: Collect site
        shell: bash
        run: |
          mkdir -p site
          cp -r sherpa-onnx/build-wasm-simd-asr/install/bin/wasm/asr/* site/
          ls -lh site/ | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
